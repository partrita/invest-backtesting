[project]
name = "invest-backtesting"
version = "0.1.0"
description = "Simple backtesting of my investment"
readme = "README.md"
authors = [
    { name = "deepthought", email = "deepthought@postech.ac.kr" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "click>=8.2.1",
    "finance-datareader>=0.9.94",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
]

[project.scripts]
backtesting = "invest_backtesting.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
